name: Repo sync job

on:
  workflow_call:
    inputs:
      group:
        description: Name of the group to sync (from repo-sync.yml)
        required: true
        type: string
      id:
        description: Identifier of the calling job
        required: true
        type: string
    secrets:
      REPO_SYNC_TOKEN:
        required: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Load config
        id: config
        run: |
          CONFIG_FILE="repo-sync.yml"

          # Extract repos for the specified group
          REPOS=$(yq eval ".${INPUTS_GROUP}.repos | .[]" "$CONFIG_FILE")
          echo "repos<<EOF" >> $GITHUB_OUTPUT
          echo "$REPOS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Extract files for the specified group and convert from [source, target] pairs to source=target format
          FILES=$(yq eval ".${INPUTS_GROUP}.files | map(.[0] + \"=\" + .[1]) | .[]" "$CONFIG_FILE")
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Extract schema for the specified group; required.
          SCHEMA=$(yq eval ".${INPUTS_GROUP}.schema" "$CONFIG_FILE")
          if [[ -z "$SCHEMA" || "$SCHEMA" == "null" ]]; then
            echo "ERROR: Group '${INPUTS_GROUP}' has no schema declared in repo-sync.yml" >&2
            exit 1
          fi
          echo "schema=$SCHEMA" >> $GITHUB_OUTPUT
        env:
          INPUTS_GROUP: ${{ inputs.group }}
      - name: Sync
        id: sync
        uses: ./repo-sync-action
        with:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_EVENT_TYPE: ${{ github.event.action }}
          REPOSITORIES: ${{ steps.config.outputs.repos }}
          FILES: ${{ steps.config.outputs.files }}
          REPO_SYNC_SCHEMA_PATH: ${{ steps.config.outputs.schema }}
          TOKEN: ${{ secrets.REPO_SYNC_TOKEN }}
      - name: Comment
        if: github.event.pull_request.number
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          message: ${{ steps.sync.outputs.SYNC_SUMMARY || '' }}
          pr-number: ${{ github.event.pull_request.number }}
          comment-tag: sync-summary-${{ inputs.id }}
          mode: ${{ github.event.action == 'closed' && 'delete' || 'upsert' }}
